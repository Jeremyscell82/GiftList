name: Release APK

# Triggered when any tag starting with "v" is pushed (e.g. v1.1, v2.0).
on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to create the GitHub Release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > app/giftlist-release.jks

      - name: Write signing config
        env:
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          cat > keystore.properties <<EOF
          storeFile=app/giftlist-release.jks
          storePassword=${STORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK signature
        continue-on-error: true
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs \
            app/build/outputs/apk/release/app-release.apk

      - name: Rename APK to GiftList-<tag>.apk
        run: cp app/build/outputs/apk/release/app-release.apk "GiftList-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          files: GiftList-*.apk
          body: |
            **Default passcode: `2026`**

            Enter `2026` on the lock screen to unlock the app.

            ## Install
            1. Download the `GiftList-*.apk` file attached below.
            2. Open it on your Android phone (allow "Install unknown apps" from your browser/files app when prompted).
            3. Open GiftList and enter passcode `2026`.

            Requires Android 13 (API 33) or newer.
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
